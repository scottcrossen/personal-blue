# Personal sway overrides for personal-blue.
# Loaded after the stock config via /etc/sway/config's layered-include
# (/etc/sway/config.d/*.conf), so upstream improvements flow through.
# Only directives that differ from the stock config live here.
# Applies to every user on any freshly provisioned host — no per-user
# setup and no references to anyone's home directory.

exec_always kanshi
# Startup workspace on the laptop panel: workspace 10 when an
# external output is active, workspace 1 otherwise. `exec`, not
# exec_always — this runs once at startup and never re-pins anything;
# there is no `workspace ... output` assignment, so after startup
# workspace 10 lives wherever it is opened or moved.
exec /usr/libexec/personal-blue/startup-workspace

bindsym $mod+c exec flatpak run org.mozilla.firefox
# --no-warn: this overwrites the stock $mod+w "layout tabbed" binding.
bindsym --no-warn $mod+w exec swaylock

# suspend (locks automatically via swayidle before-sleep)
bindsym $mod+Shift+w exec systemctl suspend

# Kill window on $mod+q instead of the stock $mod+Shift+q.
unbindsym $mod+Shift+q
bindsym $mod+q kill

# Layout keys move to the function row. The stock $mod+w layout
# binding is already overwritten by the swaylock binding above, so
# only $mod+s and $mod+e need an explicit unbind.
unbindsym $mod+s
unbindsym $mod+e
bindsym $mod+F1 layout stacking
bindsym $mod+F2 layout tabbed
bindsym $mod+F3 layout toggle split

# Resize steps: 50px instead of the stock 10px. A later binding
# overwrites the stock one; --no-warn silences the warning.
mode "resize" {
    bindsym --no-warn $left resize shrink width 50px
    bindsym --no-warn $down resize grow height 50px
    bindsym --no-warn $up resize shrink height 50px
    bindsym --no-warn $right resize grow width 50px
    bindsym --no-warn Left resize shrink width 50px
    bindsym --no-warn Down resize grow height 50px
    bindsym --no-warn Up resize shrink height 50px
    bindsym --no-warn Right resize grow width 50px
}
