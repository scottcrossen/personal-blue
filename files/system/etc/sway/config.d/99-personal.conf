# Personal sway overrides for personal-blue.
# Loaded after the stock config via /etc/sway/config's layered-include
# (/etc/sway/config.d/*.conf), so upstream improvements flow through.
# Only directives that differ from the stock config live here.
# Applies to every user on any freshly provisioned host — no per-user
# setup and no references to anyone's home directory.

exec_always kanshi
workspace 8 output eDP-1

bindsym $mod+c exec flatpak run org.mozilla.firefox
bindsym $mod+w exec swaylock

# suspend (locks automatically via swayidle before-sleep)
bindsym $mod+Shift+w exec systemctl suspend

# Resize steps: 50px instead of the stock 10px. A later binding
# overwrites the stock one; --no-warn silences the warning.
mode "resize" {
    bindsym --no-warn $left resize shrink width 50px
    bindsym --no-warn $down resize grow height 50px
    bindsym --no-warn $up resize shrink height 50px
    bindsym --no-warn $right resize grow width 50px
    bindsym --no-warn Left resize shrink width 50px
    bindsym --no-warn Down resize grow height 50px
    bindsym --no-warn Up resize shrink height 50px
    bindsym --no-warn Right resize grow width 50px
}
