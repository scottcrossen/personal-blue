---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/scottcrossen/personal-blue-sway-nvidia
name: personal-blue-sway-nvidia
# description will be included in the image's metadata
description: Scott's personal OS image, layered on wayblue sway-nvidia.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/sway-nvidia
image-version: 44

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system/etc
        destination: /etc # copies files/system/etc/* into the image's /etc; per-variant files live under files/system/<variant>/ with their own entry

  - type: dnf
    remove:
      packages:
        # remove the RPM Firefox in favor of the flatpak (org.mozilla.firefox)
        - firefox
        - firefox-langpacks

  - type: dnf
    install:
      packages:
        # display configuration tool
        - wdisplays
        # the only extra dependency of the Muse SDK installer
        - python3-cryptography

  - type: script # installs the Muse Linux Device SDK from a pinned commit at build time
    scripts:
      - install-muse-sdk.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
