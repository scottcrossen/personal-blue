---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/scottcrossen/personal-blue-sway-nvidia
name: personal-blue-sway-nvidia
# description will be included in the image's metadata
description: Scott's personal OS image, layered on wayblue sway-nvidia.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/sway-nvidia
image-version: 44

# module configuration, executed in order.
# Shared modules live in recipes/common/ and are included via
# `from-file:`, the way wayblue structures its recipes.
modules:
  - from-file: common/common-modules.yml
  - from-file: common/sway-modules.yml
  - from-file: common/muse-sdk-modules.yml
  - from-file: common/keeper-modules.yml
  - from-file: common/final-modules.yml
