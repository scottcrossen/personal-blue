# Keeper CLI (Keeper Commander), installed at base so the passwords
# and tokens the first-run setup needs can come from Keeper.
modules:
  - type: dnf
    install:
      packages:
        # Keeper's venv runs on Python 3.13, not the image's 3.14:
        # keeper-mlkem ships compiled wheels only up to 3.13, and
        # keepercommander trips a Python 3.14 SyntaxWarning. See
        # files/scripts/install-keeper-cli.sh.
        - python3.13

  - type: script # installs Keeper Commander (the Keeper CLI) at build time
    scripts:
      - install-keeper-cli.sh
