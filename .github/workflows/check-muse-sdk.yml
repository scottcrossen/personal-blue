name: Check Muse SDK version

# The SDK repo has no releases or tags, so the image pins a commit SHA
# (MUSE_SDK_PIN in files/scripts/install-muse-sdk.sh). This workflow
# compares that pin with upstream main weekly and opens a PR bumping
# it when main has moved. The bump PR still needs Scott's and Code
# Review's approval before merge (dual gate); the image build on the
# PR is the real test of the new pin.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned commit with upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          script="files/scripts/install-muse-sdk.sh"
          pinned=$(grep -oP 'MUSE_SDK_PIN="\K[^"]+' "$script")
          latest=$(gh api repos/facebookincubator/muse-gadget-sdk/commits/main --jq .sha)
          echo "pinned: $pinned"
          echo "latest: $latest"
          if [ "$pinned" = "$latest" ]; then
            echo "already up to date"
            exit 0
          fi
          msg=$(gh api repos/facebookincubator/muse-gadget-sdk/commits/"$latest" --jq .commit.message | head -1)
          date=$(gh api repos/facebookincubator/muse-gadget-sdk/commits/"$latest" --jq .commit.committer.date)
          python3 - "$script" "$latest" "$date" "$msg" <<'PYEOF'
          import re, sys
          path, latest, date, msg = sys.argv[1:5]
          text = open(path).read()
          text = re.sub(r'MUSE_SDK_PIN="[^"]+"', f'MUSE_SDK_PIN="{latest}"', text, count=1)
          text = re.sub(r'^# Pinned .*$', f'# Pinned {date}: {msg}', text, count=1, flags=re.M)
          open(path, "w").write(text)
          PYEOF
          short="${latest:0:7}"
          branch="muse-sdk-bump-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$script"
          git commit -m "Bump Muse SDK pin to ${short}"
          git push -u origin "$branch"
          gh pr create --title "Bump Muse SDK pin to ${short}" --body "Upstream main is now ${latest} (${date}): ${msg}.

          Updates the pinned commit in files/scripts/install-muse-sdk.sh. Needs Scott's and Code Review's approval before merge (dual gate); the image build on this PR is the real test of the new pin."
